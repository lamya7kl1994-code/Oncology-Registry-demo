<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>وحدة بيانات وأبحاث الأورام | تجربة تفاعلية</title>

<style>
:root{
--bg:#f7f5fb;
--card:#ffffff;
--ink:#1f2330;
--muted:#5b6174;
--line:#e6e2f2;
--accent:#5a3ec8;
--good:#1f8a5f;
--warn:#c07a00;
--bad:#b3261e;
--radius:14px;
--shadow:0 10px 26px rgba(25,18,56,.10);
}

*{box-sizing:border-box}
body{
margin:0;
font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
background:var(--bg);
color:var(--ink);
}

.wrap{max-width:560px;margin:0 auto;padding:12px}

.header{
background:linear-gradient(135deg, rgba(90,62,200,.12), rgba(47,108,255,.10));
border-radius:16px;
padding:12px;
margin-bottom:12px;
box-shadow:var(--shadow);
}

.header h1{margin:0 0 6px;font-size:15px;color:var(--accent)}
.header p{margin:0;font-size:12.5px;color:var(--muted)}

.card{
background:var(--card);
border-radius:var(--radius);
padding:12px;
box-shadow:var(--shadow);
margin:10px 0;
}

.card h2{margin:0 0 10px;font-size:14px;color:var(--accent)}

.toggle{
display:flex;
justify-content:space-between;
align-items:flex-start;
padding:10px;
border:1px solid var(--line);
border-radius:12px;
margin:8px 0;
}

.toggle label{font-size:13px}
.toggle small{display:block;color:var(--muted);font-size:11.5px}

.range-wrap{
margin:12px 0;
}
.range-wrap label{
font-size:13px;
display:block;
margin-bottom:6px;
}
input[type=range]{width:100%}

.pattern{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:6px;
margin:10px 0;
}
.pattern span{
height:16px;
border-radius:4px;
background:#c9c3f3;
}
.pattern.warn span{opacity:.35}
.pattern.bad span{background:#f2b8b5}

.impact{
padding:10px;
border-radius:12px;
font-size:12.8px;
line-height:1.55;
}
.good{background:#e6f5ef;color:var(--good)}
.warn{background:#fff4e5;color:var(--warn)}
.bad{background:#fdecea;color:var(--bad)}

.footer{
text-align:center;
font-size:12px;
color:var(--muted);
margin-top:12px;
}
</style>
</head>

<body>
<div class="wrap">

<div class="header">
<h1>تجربة تفاعلية: اكتمال سجل الأورام</h1>
<p>غيّر عدد المرضى والعناصر وشاهد كيف يظهر (أو لا يظهر) النمط.</p>
</div>

<section class="card">
<h2>عناصر البيانات</h2>

<div class="toggle">
<label>Stage <small>المقارنة حسب شدة المرض</small></label>
<input type="checkbox" checked id="stage">
</div>

<div class="toggle">
<label>Follow-up <small>تحليل النتائج عبر الزمن</small></label>
<input type="checkbox" checked id="follow">
</div>

<div class="toggle">
<label>التاريخ العائلي</label>
<input type="checkbox" checked id="family">
</div>

<div class="toggle">
<label>التدخين / التعرضات</label>
<input type="checkbox" checked id="smoking">
</div>
</section>

<section class="card">
<h2>عدد المرضى</h2>
<div class="range-wrap">
<label>عدد المرضى المتراكمين: <strong><span id="count">100</span></strong></label>
<input type="range" min="10" max="500" step="10" value="100" id="patients">
</div>
</section>

<section class="card">
<h2>ظهور النمط</h2>
<div id="patternGrid" class="pattern">
<span></span><span></span><span></span><span></span><span></span><span></span>
<span></span><span></span><span></span><span></span><span></span><span></span>
</div>
<div id="impactBox" class="impact"></div>
</section>

<div class="footer">
النمط لا يظهر من حالة واحدة… بل من التراكم والاكتمال
</div>

</div>

<script>
const els = {
stage, follow, family, smoking,
patients: document.getElementById("patients"),
count: document.getElementById("count"),
pattern: document.getElementById("patternGrid"),
impact: document.getElementById("impactBox")
};

function update(){
const n = +els.patients.value;
els.count.textContent = n;

const missing =
(!els.stage.checked) + (!els.follow.checked) +
(!els.family.checked) + (!els.smoking.checked);

els.pattern.className = "pattern";
els.pattern.querySelectorAll("span").forEach(s=>s.style.opacity=1);

if(missing >= 2){
els.pattern.classList.add("bad");
els.impact.className="impact bad";
els.impact.textContent="✖ نقص جوهري في البيانات → لا يمكن ظهور نمط مهما زاد العدد.";
return;
}

if(n < 50){
els.pattern.classList.add("bad");
els.impact.className="impact bad";
els.impact.textContent="عدد المرضى محدود جدًا → لا يظهر أي نمط.";
}
else if(n < 150){
els.pattern.classList.add("warn");
els.impact.className="impact warn";
els.impact.textContent="تظهر ملاحظات أولية، لكن النمط غير مستقر.";
}
else if(n < 300){
els.impact.className="impact good";
els.impact.textContent="يتكوّن نمط فعلي يمكن ملاحظته.";
}
else{
els.impact.className="impact good";
els.impact.textContent="نمط واضح ومتكرر ناتج عن تراكم كافٍ من المرضى.";
}
}

[stage,follow,family,smoking,patients].forEach(el=>{
el.addEventListener("input",update);
});

update();
</script>

</body>
</html>
